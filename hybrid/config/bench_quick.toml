# Quick bench config for the research loop (S5). Every task, two train sizes, a short training
# budget, all five baselines, and a short scaling probe. Use
# hybrid/bench/configs/default.toml for the full comparison.
seed = 0
model_seed = 0
n_test = 128
train_sizes = [32, 128]
# ssm and linear_attention added 2026-10-10 18:06 so S5 fingerprints can flag those families;
# transformer added 2026-10-11 so the quick config runs every baseline (FINAL-REPORT.md section 5 item 7).
baselines = ["ngram", "gru", "transformer", "ssm", "linear_attention"]
parallel_jobs = 2
image = "localhost/bigbrane/executor@sha256:7fa94b73a3f6fbd6b6544d075e24ff8bf28fae2662771e577a332348d4a00f1b"

[budget]
max_steps = 200
max_epochs = 20
batch_size = 32
lr = 0.003

[caps.candidate]
wall_s = 900
memory_mb = 2048
pids = 128
tmp_mb = 64

[caps.evaluator]
wall_s = 300
memory_mb = 1024
pids = 64
tmp_mb = 64

[scaling]
task = "hmm"
train_size = 32
lengths_log2 = [6, 10]
batch = 2
repeats = 3
warmup = 1
seed = 7
stop_after_s = 5.0
tolerance = 0.5
tail_points = 3

[tasks.hmm]
target = { metric = "kl", op = "<=", value = 0.1 }

[tasks.vom]

[tasks.recall]
params = { k_values = [2, 8], n_keys = 16, n_values = 8, n_queries = 8 }
target = { metric = "acc", op = ">=", value = 0.3, group = "2" }

[tasks.compose]

[tasks.fewshot]
params = { modulus = 13, shots = [2, 4, 8], n_queries = 4, test_fraction = 0.3 }
