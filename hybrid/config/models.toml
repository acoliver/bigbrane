# Phase 7 refinement dialogue (stage R) and the S2 difference check: never the proposer's family. refine_challenger
# serves cards a Claude model drafted, refine_challenger_alt cards a GPT model drafted.
# On this table each falls back inside its own family (terra, opus), as falsifier_designer does, so a judges-mode run
