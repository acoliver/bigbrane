  { backend = "llxprt", model = "opus" },
]
# Not in the spec table: a local role for smoke tests and cheap bulk work.
# model = "auto" picks the first non-embedding model reported by GET /models.
local = [
  { backend = "lmstudio", model = "auto" },
]

